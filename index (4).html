<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070d">
<title>Banger Lines 🔊</title>
<style>
:root{--bg:#07070d;--ink:#f6f6fb;--mute:#a0a0bb;--a:#ff4d6d;--b:#7c5cff;--c:#22d3ee;--glass:#ffffff0f;--line:#ffffff1c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:110px}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.aurora{position:fixed;inset:-20%;z-index:-1;filter:blur(100px);opacity:.45}
.aurora i{position:absolute;width:45vmax;height:45vmax;border-radius:50%;animation:fl 20s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:var(--a);left:-8%;top:-5%}
.aurora i:nth-child(2){background:var(--b);right:-12%;top:25%;animation-delay:-7s}
.aurora i:nth-child(3){background:var(--c);left:30%;bottom:-25%;animation-delay:-13s;opacity:.5}
@keyframes fl{to{transform:translate(8vmax,-6vmax) scale(1.2)}}
.wrap{max-width:1120px;margin:auto;padding:0 16px}
.top{position:sticky;top:0;z-index:5;background:#07070dcc;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;gap:12px;align-items:center;padding:12px 16px;flex-wrap:wrap}
.logo{font-weight:900;font-size:1.35rem;letter-spacing:-.02em;background:linear-gradient(90deg,var(--a),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
#q{flex:1 1 220px;padding:11px 18px;border-radius:99px;border:1px solid var(--line);background:var(--glass);color:var(--ink);font:inherit;outline:none}
#q:focus{border-color:var(--b)}
.hero{margin:20px 0 10px;padding:34px 30px;border-radius:28px;position:relative;overflow:hidden;border:1px solid var(--line);
 background:radial-gradient(120% 140% at 0% 0%,#ff4d6d44,transparent 60%),radial-gradient(100% 120% at 100% 100%,#7c5cff55,transparent 60%),#12121c}
.hero h1{margin:0 0 8px;font-size:clamp(1.9rem,6vw,3.4rem);line-height:1.05;letter-spacing:-.03em;max-width:640px}
.hero h1 b{background:linear-gradient(90deg,var(--a),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0 0 20px;color:var(--mute);max-width:480px}
.btn{border:0;border-radius:99px;padding:13px 26px;font-weight:800;color:#fff;background:linear-gradient(90deg,var(--a),var(--b));box-shadow:0 8px 30px #ff4d6d55;transition:transform .15s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 38px #ff4d6d77}.btn:active{transform:scale(.96)}
.eq{display:flex;gap:5px;align-items:flex-end;height:70px;position:absolute;right:30px;bottom:30px}
.eq i,.ov i{width:7px;background:linear-gradient(var(--c),var(--a));border-radius:4px;animation:eq 1s ease-in-out infinite alternate}
.eq i:nth-child(odd),.ov i:nth-child(odd){animation-duration:.65s}.eq i:nth-child(3n),.ov i:nth-child(3n){animation-duration:1.25s}
@keyframes eq{from{height:12%}to{height:100%}}
.mq{overflow:hidden;white-space:nowrap;margin:14px 0 6px;mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mq div{display:inline-block;animation:mq 60s linear infinite;color:var(--mute);font-weight:700}
.mq span{margin:0 22px}.mq span::before{content:"♪ ";color:var(--a)}
@keyframes mq{to{transform:translateX(-50%)}}
h2.sec{font-size:1.25rem;margin:26px 0 12px;letter-spacing:-.01em}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.tabs button{flex:none;background:var(--glass);border:1px solid var(--line);border-radius:99px;padding:9px 18px;transition:.2s}
.tabs button.on{background:linear-gradient(90deg,var(--a),var(--b));border-color:transparent;transform:scale(1.05)}
/* covers */
.cv{background:#1b1b29 center/cover;border-radius:16px;position:relative;overflow:hidden;flex:none}
.cv:not(.ld){animation:sh 1.4s infinite;background-image:linear-gradient(100deg,#1b1b29 30%,#2a2a3d 50%,#1b1b29 70%);background-size:200% 100%}
@keyframes sh{to{background-position:-200% 0}}
.cv::after{content:"▶";position:absolute;inset:0;display:grid;place-items:center;background:#0009;opacity:0;transition:.2s;font-size:1.6rem}
.card:hover .cv::after,.tile:hover .cv::after{opacity:1}
.ov{display:none;position:absolute;inset:0;background:#000a;align-items:flex-end;justify-content:center;gap:3px;padding:10px;z-index:2}
.ov i{width:5px}
.now .ov{display:flex}.now .cv::after{display:none}
/* row */
.row{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 14px;scrollbar-width:none}
.tile{flex:none;width:168px;scroll-snap-align:start;border:0;background:none;text-align:left;padding:0;position:relative}
.tile .cv{width:168px;height:168px;border-radius:20px;box-shadow:0 14px 34px #0008;transition:transform .25s}
.tile:hover .cv{transform:translateY(-6px) scale(1.03)}
.tile b{display:block;margin-top:10px;font-size:.95rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile small{color:var(--mute)}
/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;padding-bottom:30px}
.card{--cover:none;position:relative;display:flex;gap:14px;align-items:center;text-align:left;padding:12px;border:1px solid var(--line);border-radius:22px;background:#12121c;overflow:hidden;animation:rise .5s both;transition:transform .2s,border-color .2s}
.card::before{content:"";position:absolute;inset:0;background:var(--cover) center/cover;filter:blur(34px) saturate(1.8);opacity:.28;transition:opacity .3s}
.card:hover{transform:translateY(-3px);border-color:#ffffff40}.card:hover::before{opacity:.5}
.card:active{transform:scale(.98)}
.card>*{position:relative}
.card .cv{width:92px;height:92px}
.card b{display:block;font-size:1.02rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card small{display:block;margin-top:6px;color:#ffffffb0;font-size:.82rem}
.pill{display:inline-block;margin-left:6px;padding:1px 9px;border-radius:99px;background:#ffffff1f;font-size:.72rem}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.add{display:flex;gap:8px;flex-wrap:wrap;padding:8px 0 40px}
.add input,.add select{padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--glass);color:var(--ink);font:inherit}
.add input{flex:1 1 180px}.add option{color:#000}
/* mini player */
#mini{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translate(-50%,160%);width:min(720px,calc(100% - 24px));z-index:8;display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:22px;background:#161622ee;backdrop-filter:blur(20px);border:1px solid var(--line);box-shadow:0 14px 50px #000a;transition:transform .45s cubic-bezier(.2,1,.3,1);cursor:pointer;overflow:hidden}
#mini.on{transform:translate(-50%,0)}
#mini .cv{width:48px;height:48px;border-radius:12px}
#mini .t{flex:1;min-width:0}
#mini b,#mini small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini small{color:var(--mute);font-size:.8rem}
.ib{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--glass);font-size:1.05rem;transition:.15s;flex:none}
.ib:active{transform:scale(.9)}.ib.big{width:68px;height:68px;font-size:1.6rem;background:linear-gradient(135deg,var(--a),var(--b));border:0;box-shadow:0 10px 34px #ff4d6d66}
.ib.on{background:linear-gradient(135deg,var(--a),var(--b));border-color:transparent}
.mbar{position:absolute;left:0;top:0;height:3px;width:0;background:linear-gradient(90deg,var(--a),var(--c))}
/* sheet */
.sheet{position:fixed;inset:0;z-index:20;transform:translateY(105%);transition:transform .5s cubic-bezier(.2,1,.3,1);display:flex;flex-direction:column;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 18px calc(16px + env(safe-area-inset-bottom));overflow-y:auto;background:#06060b}
.sheet.open{transform:none}
#sbg{position:absolute;inset:-10%;background:center/cover;filter:blur(70px) brightness(.55) saturate(1.8);transition:background-image .6s;z-index:0}
.sheet>*{position:relative;z-index:1;width:100%;max-width:720px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
#back{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--glass);border-radius:99px;padding:10px 18px;font-weight:700;backdrop-filter:blur(10px)}
#sLang{color:var(--mute);font-size:.9rem}
.vw{position:relative;aspect-ratio:16/9;border-radius:24px;overflow:hidden;background:#111 center/cover;box-shadow:0 20px 70px #000b,0 0 80px #ff4d6d33}
.vw iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
.vw.nov iframe{visibility:hidden}
#bang{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;text-align:center;padding:18px;gap:0 .3em;font-weight:900;font-size:clamp(1.5rem,6vw,3rem);line-height:1.15;background:#050509e6;opacity:0;pointer-events:none;transition:opacity .4s}
.vw.dim #bang{opacity:1}
#bang span{display:inline-block;opacity:0;transform:translateY(26px) scale(.6);animation:pop .45s cubic-bezier(.2,1.6,.4,1) forwards;background:linear-gradient(90deg,#fff,#ffc2cf);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes pop{to{opacity:1;transform:none}}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-5px,2px)}80%{transform:translate(5px,-2px)}}
#conf{position:fixed;inset:0;pointer-events:none;z-index:30}
.meta{margin:18px 0 8px}
.meta h3{margin:0;font-size:1.4rem;letter-spacing:-.01em}.meta p{margin:2px 0 0;color:var(--mute)}
.pb{height:6px;border-radius:9px;background:#ffffff26;overflow:hidden}.pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--c))}
.tl{display:flex;justify-content:space-between;color:var(--mute);font-size:.82rem;margin:8px 0 14px}
.ctl{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.opt{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.opt button{border:1px solid var(--line);background:var(--glass);border-radius:99px;padding:9px 16px;font-size:.9rem}
.opt button.on{background:linear-gradient(90deg,var(--a),var(--b));border-color:transparent}
#st{text-align:center;color:var(--mute);font-size:.85rem;min-height:1.3em;margin-top:12px}
@media(max-width:520px){.hero{padding:26px 20px}.eq{display:none}}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>
<div class="top"><div class="wrap"><span class="logo">🔊 Banger Lines</span><input id="q" type="search" placeholder="Search a line, song or language…"></div></div>
<div class="wrap">
  <section class="hero">
    <h1>Let the <b>beat build</b>. Then the line lands.</h1>
    <p>Real banger, over a minute of it, and then the iconic line hits. Start party mode and it never stops.</p>
    <button class="btn" id="party">▶ Start party mode</button>
    <div class="eq"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </section>
  <div class="mq"><div id="mq"></div></div>
  <div id="rowbox"><h2 class="sec">🔥 Trending now</h2><div class="row" id="row"></div></div>
  <h2 class="sec" id="gt">All bangers</h2>
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid" style="margin-top:14px"></div>
  <form class="add" id="form">
    <input id="fl" placeholder="Your iconic line" required>
    <input id="fs" placeholder="Song (e.g. Tauba Tauba Karan Aujla)" required>
    <select id="fg"><option value="hi">Hindi</option><option value="en">English</option><option value="pa">Punjabi</option></select>
    <button class="btn">Add</button>
  </form>
</div>

<div id="mini">
  <div class="mbar" id="mp"></div>
  <div class="cv ld" id="mArt"></div>
  <div class="t"><b id="mT">—</b><small id="mS"></small></div>
  <button class="ib" id="mpp">⏸</button><button class="ib" id="mnx">⏭</button>
</div>

<div class="sheet" id="sheet">
  <div id="sbg"></div>
  <div class="bar"><button id="back">⌄ Back</button><span id="sLang"></span></div>
  <div class="vw" id="vw"><div id="ytp"></div><div id="bang"></div></div>
  <div class="meta"><h3 id="sT">—</h3><p id="sA"></p></div>
  <div class="pb"><i id="pf"></i></div>
  <div class="tl"><span id="tl">—</span><span id="tr"></span></div>
  <div class="ctl">
    <button class="ib" id="prev">⏮</button><button class="ib" id="b10">−10</button>
    <button class="ib big" id="pp">⏸</button>
    <button class="ib" id="f10">+10</button><button class="ib" id="nx">⏭</button>
  </div>
  <div class="opt"><button id="auto" class="on">♾ Autoplay</button><button id="shuf">🔀 Shuffle</button><button id="now">⚡ Drop line now</button></div>
  <div id="st"></div>
</div>
<canvas id="conf"></canvas>
<audio id="au" preload="auto" playsinline></audio>

<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const LANG={all:"All",hot:"🔥 Trending",hi:"Hindi",en:"English",pa:"Punjabi"};
const VOICE={hi:"hi-IN",en:"en-US",pa:"pa-IN"};
const DEF_START=40,DEF_DUR=70; // seconds into the full song, and how long to play it
let items=[],filter="all",term="",queue=[],idx=-1,token=0,auto=true,shuf=false,paused=false,phase="idle",mode="pre";
let yt,ytReady=false,tick=0,t0=0,pend=null;
const au=$("#au"),P={},R={};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};

/* ---------- data ---------- */
function jsonp(url){return new Promise((res,rej)=>{const cb="cb"+Date.now()+Math.floor(Math.random()*999),s=document.createElement("script");
  window[cb]=d=>{res(d);s.remove();delete window[cb]};s.onerror=rej;s.src=url+"&callback="+cb;document.head.appendChild(s)})}
function meta(it){
  return P[it.song]||(P[it.song]=(async()=>{
    let r;
    try{const x=await fetch("/api/search?term="+encodeURIComponent(it.song));if(x.ok)r=await x.json()}catch(e){}
    if(!r){try{const d=await jsonp("https://itunes.apple.com/search?media=music&entity=song&limit=5&country=IN&term="+encodeURIComponent(it.song));
      const t=(d.results||[]).find(x=>x.previewUrl);if(t)r={previewUrl:t.previewUrl,title:t.trackName,artist:t.artistName,art:(t.artworkUrl100||"").replace("100x100","500x500")}}catch(e){}}
    r=r||{};if(it.yt)r.yt=it.yt;
    R[it.song]=r;paint(it.song);return r})())
}
function paint(song){const r=R[song];if(!r)return;
  $$(`[data-s="${CSS.escape(song)}"]`).forEach(el=>{
    if(r.art){el.style.setProperty("--cover",`url("${r.art}")`);const c=el.querySelector(".cv");if(c){c.style.backgroundImage=`url("${r.art}")`;c.classList.add("ld")}}
    const a=el.querySelector("small");if(a&&r.artist&&!a.dataset.d){a.dataset.d=1;a.firstChild.textContent=r.artist+" · "}})}
async function warm(list){for(let i=0;i<list.length;i+=4)await Promise.all(list.slice(i,i+4).map(meta))}

/* ---------- home ---------- */
async function init(){
  try{items=await (await fetch("catalog.json")).json()}catch(e){items=[]}
  $("#tabs").innerHTML=Object.entries(LANG).map(([k,v])=>`<button data-k="${k}" class="${k==="all"?"on":""}">${v}</button>`).join("");
  $("#tabs").onclick=e=>{const k=e.target.dataset.k;if(!k)return;filter=k;$$("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.k===k));render()};
  $("#q").oninput=e=>{term=e.target.value.toLowerCase();render()};
  const m=items.map(i=>`<span>${i.line}</span>`).join("");$("#mq").innerHTML=m+m;
  render();warm(items);
}
function visible(){return items.filter(i=>(filter==="all"||(filter==="hot"?i.hot:i.lang===filter))&&(i.line+i.song+LANG[i.lang]).toLowerCase().includes(term))}
const EQ='<div class="ov"><i></i><i></i><i></i><i></i></div>';
function render(){
  queue=visible();
  $("#rowbox").style.display=filter==="all"&&!term?"":"none";
  $("#gt").textContent=term?"Results":LANG[filter]==="All"?"All bangers":LANG[filter];
  $("#row").innerHTML="";$("#grid").innerHTML="";
  items.filter(i=>i.hot).forEach(it=>{
    const b=document.createElement("button");b.className="tile";b.dataset.s=it.song;
    b.innerHTML=`<div class="cv">${EQ}</div><b></b><small><span></span></small>`;
    b.querySelector("b").textContent="“"+it.line+"”";b.querySelector("small span").textContent=LANG[it.lang];
    b.onclick=()=>{const i=queue.indexOf(it);if(i>-1)play(i);else{filter="all";term="";$("#q").value="";render();play(queue.indexOf(it))}};
    $("#row").appendChild(b)});
  queue.forEach((it,n)=>{
    const b=document.createElement("button");b.className="card";b.dataset.s=it.song;b.style.animationDelay=Math.min(n*35,500)+"ms";
    b.innerHTML=`<div class="cv">${EQ}</div><div><b></b><small><span></span><i class="pill"></i></small></div>`;
    b.querySelector("b").textContent="“"+it.line+"”";
    b.querySelector("small span").textContent="";b.querySelector(".pill").textContent=LANG[it.lang];
    b.onclick=()=>play(n);$("#grid").appendChild(b)});
  Object.keys(R).forEach(paint);
  if(idx>-1&&queue[idx])mark(queue[idx]);
}
function mark(it){$$(".now").forEach(c=>c.classList.remove("now"));$$(`[data-s="${CSS.escape(it.song)}"]`).forEach(c=>c.classList.add("now"))}

/* ---------- YouTube ---------- */
window.onYouTubeIframeAPIReady=()=>{yt=new YT.Player("ytp",{playerVars:{playsinline:1,controls:0,rel:0,modestbranding:1,iv_load_policy:3,disablekb:1,fs:0},
  events:{onReady:()=>ytReady=true,onError:()=>{if(idx>-1&&queue[idx]){queue[idx]._noyt=1;play(idx)}}}})};
(()=>{const s=document.createElement("script");s.src="https://www.youtube.com/iframe_api";document.head.appendChild(s)})();

/* ---------- player ---------- */
function openSheet(){if(!$("#sheet").classList.contains("open")){history.pushState({sheet:1},"");$("#sheet").classList.add("open");document.body.classList.add("lock")}}
function closeSheet(){if($("#sheet").classList.contains("open"))history.back()}
addEventListener("popstate",()=>{$("#sheet").classList.remove("open");document.body.classList.remove("lock")});
$("#back").onclick=closeSheet;
$("#mini").onclick=e=>{if(!e.target.closest(".ib"))openSheet()};

function ui(it,r){
  const art=r&&r.art?`url("${r.art}")`:"none";
  $("#sT").textContent=(r&&r.title)||it.song;$("#sA").textContent=(r&&r.artist)||"";$("#sLang").textContent=LANG[it.lang];
  $("#vw").style.backgroundImage=art;$("#sbg").style.backgroundImage=art;
  $("#mArt").style.backgroundImage=art;$("#mArt").classList.add("ld");
  $("#mT").textContent="“"+it.line+"”";$("#mS").textContent=((r&&r.title)||it.song)+((r&&r.artist)?" · "+r.artist:"");
  $("#mini").classList.add("on");mark(it);
}
function setLine(t){const b=$("#bang");b.innerHTML="";$("#vw").classList.toggle("dim",!!t);
  if(t)t.split(" ").forEach((w,i)=>{const s=document.createElement("span");s.textContent=w;s.style.animationDelay=i*90+"ms";b.appendChild(s)})}
function prog(pos,total){const p=Math.min(100,Math.max(0,pos/total*100))+"%";$("#pf").style.width=p;$("#mp").style.width=p;
  $("#tl").textContent=pos>=total?"Line dropped 🎤":"Line lands in "+fmt(total-pos);$("#tr").textContent=fmt(pos)+" / "+fmt(total)}
function icons(){const i=paused?"▶":"⏸";$("#pp").textContent=i;$("#mpp").textContent=i}
function playing(){return mode==="yt"?ytReady&&yt.getPlayerState&&yt.getPlayerState()===1:!au.paused}

async function play(i,cued){
  if(!queue.length||i<0)return;
  const my=++token;clearInterval(tick);pend=null;
  idx=i;const it=queue[i];phase="load";paused=false;icons();
  openSheet();try{speechSynthesis.cancel()}catch(e){}
  au.pause();if(ytReady)try{yt.pauseVideo()}catch(e){}
  setLine("");$("#st").textContent="Loading…";prog(0,DEF_DUR);ui(it,R[it.song]);
  const r=await meta(it);if(my!==token)return;ui(it,r);
  const useYT=!!(r.yt&&ytReady&&!it._noyt);
  if(!useYT&&!r.previewUrl){$("#st").textContent="Couldn’t find that song, skipping…";await wait(1500);if(my===token&&auto)go(1);return}
  mode=useYT?"yt":"pre";$("#vw").classList.toggle("nov",!useYT);
  const start=it.start??DEF_START;let dur=useYT?(it.dur??DEF_DUR):28;
  if(useYT){yt.setVolume(100);cued?yt.playVideo():yt.loadVideoById({videoId:r.yt,startSeconds:start})}
  else{au.volume=1;au.src=r.previewUrl;au.play().catch(()=>{$("#st").textContent="Tap ▶ to allow audio"})}
  $("#st").textContent=useYT?"":"Preview mode (30s). Add a YouTube key for full-length clips.";
  phase="play";t0=Date.now();
  tick=setInterval(()=>{
    if(my!==token){clearInterval(tick);return}
    if(paused)return;
    if(!playing()){const w=Date.now()-t0;
      if(w>7000&&w<7300)$("#st").textContent="Tap ▶ if it hasn’t started";
      if(w>16000){clearInterval(tick);if(useYT){it._noyt=1;play(i)}else if(auto)go(1)}
      return}
    const pos=useYT?yt.getCurrentTime()-start:au.currentTime;
    const total=useYT?dur:Math.min(dur,(au.duration||28)-.4);
    prog(pos,total);
    if(pos>=total||(!useYT&&au.ended))endPlay(my,it);
  },200);
}
async function fadeOut(){for(let v=100;v>=0;v-=10){if(mode==="yt"&&ytReady)yt.setVolume(v);else au.volume=v/100;await wait(70)}}
function speak(t,l){return new Promise(res=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=VOICE[l];u.rate=.95;u.onend=u.onerror=()=>res();speechSynthesis.speak(u);setTimeout(res,8000)}catch(e){res()}})}
function nextIdx(){return shuf&&queue.length>1?(()=>{let n;do n=Math.floor(Math.random()*queue.length);while(n===idx);return n})():(idx+1)%queue.length}

async function endPlay(my,it){
  clearInterval(tick);phase="line";
  await fadeOut();if(my!==token)return;
  if(mode==="yt"&&ytReady)yt.pauseVideo();else au.pause();
  prog(1,1);setLine(it.line);boom();const sp=speak(it.line,it.lang);
  if(auto){ // cue the next song while the line is on screen -> no gap
    const n=nextIdx();pend={i:n,cued:false};const nr=await meta(queue[n]);
    if(my===token&&mode==="yt"&&ytReady&&nr.yt&&!queue[n]._noyt){yt.cueVideoById({videoId:nr.yt,startSeconds:queue[n].start??DEF_START});pend.cued=true}
  }
  await Promise.all([sp,wait(2400+it.line.length*40)]);if(my!==token)return;
  if(auto){while(paused&&my===token)await wait(300);if(my===token&&pend)play(pend.i,pend.cued)}
  else $("#st").textContent="Autoplay is off. Tap ⏭ for the next one.";
}
function go(d){pend=null;if(!queue.length)return;play(d>0?nextIdx():(idx-1+queue.length)%queue.length,false)}
function toggle(){
  if(phase==="idle"){if(queue.length)play(0);return}
  if(phase==="play"&&!paused&&!playing()){mode==="yt"?yt.playVideo():au.play();return}
  paused=!paused;icons();
  if(phase==="play"){if(mode==="yt")paused?yt.pauseVideo():yt.playVideo();else paused?au.pause():au.play();t0=Date.now()}
}
function seek(d){if(phase!=="play")return;const it=queue[idx];
  if(mode==="yt")yt.seekTo(Math.max(it.start??DEF_START,yt.getCurrentTime()+d),true);else au.currentTime=Math.max(0,au.currentTime+d)}

/* ---------- fx ---------- */
const cv=$("#conf"),cx=cv.getContext("2d");let ps=[];
function boom(){cv.width=innerWidth;cv.height=innerHeight;
  const s=$("#sheet");s.classList.remove("shake");void s.offsetWidth;s.classList.add("shake");
  ps=Array.from({length:120},()=>({x:cv.width/2,y:cv.height*.35,vx:(Math.random()-.5)*15,vy:-Math.random()*13-3,r:Math.random()*6+3,c:`hsl(${Math.random()*360} 90% 60%)`,l:100}));
  (function f(){cx.clearRect(0,0,cv.width,cv.height);ps=ps.filter(p=>p.l-->0);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;cx.fillStyle=p.c;cx.globalAlpha=p.l/100;cx.fillRect(p.x,p.y,p.r,p.r)});
    if(ps.length)requestAnimationFrame(f)})()}

/* ---------- wiring ---------- */
$("#pp").onclick=$("#mpp").onclick=toggle;
$("#nx").onclick=$("#mnx").onclick=()=>go(1);$("#prev").onclick=()=>go(-1);
$("#b10").onclick=()=>seek(-10);$("#f10").onclick=()=>seek(10);
$("#now").onclick=()=>{if(phase==="play")endPlay(token,queue[idx])};
$("#auto").onclick=e=>{auto=!auto;e.currentTarget.classList.toggle("on",auto)};
$("#shuf").onclick=e=>{shuf=!shuf;e.currentTarget.classList.toggle("on",shuf)};
$("#party").onclick=()=>{auto=true;$("#auto").classList.add("on");filter="all";term="";$("#q").value="";render();play(0)};
$("#form").onsubmit=e=>{e.preventDefault();
  const it={line:$("#fl").value.trim(),song:$("#fs").value.trim(),lang:$("#fg").value};items.unshift(it);e.target.reset();render();meta(it)};
addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;
  if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1);if(e.key==="Escape")closeSheet();if(e.key===" "){e.preventDefault();toggle()}});
init();
</script>
</body>
