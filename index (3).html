<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b12">
<title>Banger Lines 🔊</title>
<style>
:root{--bg:#0b0b12;--card:#161622;--ink:#f5f5fa;--mute:#9a9ab5;--a:#ff4d6d;--b:#7c5cff;--c:#22d3ee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,-apple-system,sans-serif;overflow-x:hidden}
.aurora{position:fixed;inset:-20%;z-index:-1;filter:blur(90px);opacity:.55}
.aurora i{position:absolute;width:45vmax;height:45vmax;border-radius:50%;animation:float 18s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:var(--a);left:-5%;top:0}
.aurora i:nth-child(2){background:var(--b);right:-10%;top:20%;animation-delay:-6s}
.aurora i:nth-child(3){background:var(--c);left:30%;bottom:-20%;animation-delay:-12s;opacity:.6}
@keyframes float{to{transform:translate(8vmax,-6vmax) scale(1.2)}}
.wrap{max-width:1100px;margin:auto;padding:0 16px}
header{display:flex;align-items:center;gap:12px;padding:20px 0 8px;flex-wrap:wrap}
.logo{font-weight:900;font-size:1.5rem;background:linear-gradient(90deg,var(--a),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
#q{flex:1 1 200px;padding:11px 16px;border-radius:99px;border:1px solid #ffffff22;background:#ffffff0d;color:var(--ink);font:inherit;backdrop-filter:blur(8px)}
.hero{margin:14px 0;padding:28px;border-radius:24px;background:linear-gradient(135deg,#ff4d6d33,#7c5cff33);border:1px solid #ffffff1f;position:relative;overflow:hidden;backdrop-filter:blur(10px)}
.hero h2{margin:0 0 6px;font-size:clamp(1.6rem,5vw,2.6rem)}
.hero p{margin:0 0 18px;color:var(--mute)}
.btn{border:0;border-radius:99px;padding:12px 24px;font:inherit;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--a),var(--b));cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.95)}
.eq{display:flex;gap:4px;align-items:flex-end;height:56px;position:absolute;right:24px;top:24px}
.eq i,.big-eq i{width:7px;background:linear-gradient(var(--c),var(--a));border-radius:4px;animation:eq 1s ease-in-out infinite alternate}
.eq i:nth-child(odd),.big-eq i:nth-child(odd){animation-duration:.7s}
.eq i:nth-child(3n),.big-eq i:nth-child(3n){animation-duration:1.3s}
@keyframes eq{from{height:12%}to{height:100%}}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.tabs button{flex:none;background:#ffffff0d;color:var(--ink);border:1px solid #ffffff22;border-radius:99px;padding:9px 18px;cursor:pointer;font:inherit;transition:.2s}
.tabs button.on{background:linear-gradient(90deg,var(--a),var(--b));border-color:transparent;transform:scale(1.05)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;padding:10px 0 30px}
.card{--h:0;position:relative;text-align:left;color:var(--ink);font:inherit;border:1px solid #ffffff1a;border-radius:18px;padding:18px;min-height:130px;cursor:pointer;overflow:hidden;
 background:linear-gradient(145deg,hsl(var(--h) 70% 22% / .9),#161622);display:flex;flex-direction:column;gap:6px;justify-content:space-between;
 animation:rise .5s both;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px) rotate(-.6deg);box-shadow:0 12px 30px hsl(var(--h) 80% 50% / .35)}
.card:active{transform:scale(.97)}
.card b{font-size:1.05rem;line-height:1.3}
.card small{color:#ffffffa8}
.card em{position:absolute;top:10px;right:12px;font-size:.7rem;font-style:normal;background:#ffffff22;border-radius:99px;padding:2px 8px}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.add{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:50px}
.add input,.add select{padding:11px;border-radius:12px;border:1px solid #ffffff22;background:#ffffff0d;color:var(--ink);font:inherit}
.add input{flex:1 1 180px}.add select option{color:#000}
/* stage */
#stage{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center;background:#06060bf2;overflow:hidden}
#stage.show{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0}}
#bgart{position:absolute;inset:-10%;background-size:cover;background-position:center;filter:blur(60px) brightness(.5) saturate(1.6);transition:background-image .5s}
#stage>*:not(canvas):not(#bgart){position:relative}
.vinyl{width:min(52vw,230px);aspect-ratio:1;border-radius:50%;background:conic-gradient(#111,#333,#111,#2a2a2a,#111);padding:9%;box-shadow:0 0 60px #ff4d6d66;animation:spin 3s linear infinite;animation-play-state:paused}
.vinyl.on{animation-play-state:running}
.vinyl img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:#222}
@keyframes spin{to{transform:rotate(360deg)}}
#now{color:var(--mute);min-height:1.4em;font-size:.95rem}
.big-eq{display:flex;gap:5px;align-items:flex-end;height:46px}
.big-eq i{width:6px}
.big-eq.off i{animation-play-state:paused;height:10%}
.cd{width:min(70vw,360px);height:6px;border-radius:9px;background:#ffffff22;overflow:hidden}
.cd i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--c))}
.cd.go i{animation:fill var(--d) linear forwards}
@keyframes fill{to{width:100%}}
#bang{font-weight:900;font-size:clamp(1.8rem,7vw,3.8rem);line-height:1.15;max-width:900px;min-height:1.2em}
#bang span{display:inline-block;opacity:0;transform:translateY(30px) scale(.6);animation:pop .45s cubic-bezier(.2,1.6,.4,1) forwards;margin:0 .12em;background:linear-gradient(90deg,#fff,#ffd1da);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes pop{to{opacity:1;transform:none}}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-5px,2px)}80%{transform:translate(5px,-2px)}}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.ctl button{background:#ffffff14;border:1px solid #ffffff2a;color:var(--ink);border-radius:99px;padding:10px 18px;font:inherit;cursor:pointer;transition:.15s}
.ctl button:active{transform:scale(.92)}
.ctl button.on{background:linear-gradient(90deg,var(--a),var(--b));border-color:transparent}
#conf{position:absolute;inset:0;pointer-events:none}
#x{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;width:42px;height:42px;padding:0!important;font-size:1.1rem}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>
<div class="wrap">
  <header><span class="logo">🔊 Banger Lines</span><input id="q" type="search" placeholder="Search line, song, language…"></header>
  <section class="hero">
    <div class="eq"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <h2>The beat drops. Then the line lands.</h2>
    <p>Hit party mode and let it run: banger, line, next banger, repeat.</p>
    <button class="btn" id="party">▶ Start party mode</button>
  </section>
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
  <form class="add" id="form">
    <input id="fl" placeholder="Your iconic line" required>
    <input id="fs" placeholder="Song (e.g. Tauba Tauba Karan Aujla)" required>
    <select id="fg"><option value="hi">Hindi</option><option value="en">English</option><option value="pa">Punjabi</option></select>
    <button class="btn">Add</button>
  </form>
</div>

<div id="stage">
  <div id="bgart"></div><canvas id="conf"></canvas>
  <div class="ctl" id="x0"><button id="x">✕</button></div>
  <div class="vinyl" id="vinyl"><img id="art" alt=""></div>
  <div id="now"></div>
  <div class="big-eq off" id="beq"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="cd" id="cd"><i></i></div>
  <div id="bang"></div>
  <div class="ctl">
    <button id="prev">⏮</button><button id="again">↻ Replay</button><button id="next">⏭</button>
    <button id="auto" class="on">Autoplay</button><button id="shuf">Shuffle</button>
  </div>
</div>
<audio id="au" preload="auto"></audio>

<script>
const $=s=>document.querySelector(s);
const LANG={all:"All",hot:"🔥 Trending",hi:"Hindi",en:"English",pa:"Punjabi"};
const VOICE={hi:"hi-IN",en:"en-US",pa:"pa-IN"};
let items=[],filter="all",term="",queue=[],idx=0,token=0,auto=true,shuf=false,timer=0;
const au=$("#au"),cache={};

async function init(){
  try{items=await (await fetch("catalog.json")).json()}catch(e){items=[]}
  $("#tabs").innerHTML=Object.entries(LANG).map(([k,v])=>`<button data-k="${k}" class="${k==="all"?"on":""}">${v}</button>`).join("");
  $("#tabs").onclick=e=>{const k=e.target.dataset.k;if(!k)return;filter=k;
    document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.k===k));render()};
  $("#q").oninput=e=>{term=e.target.value.toLowerCase();render()};
  render();
}
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
function visible(){return items.filter(i=>(filter==="all"||(filter==="hot"?i.hot:i.lang===filter))&&(i.line+i.song+LANG[i.lang]).toLowerCase().includes(term))}
function render(){
  queue=visible();$("#grid").innerHTML="";
  queue.forEach((it,n)=>{
    const b=document.createElement("button");b.className="card";
    b.style.setProperty("--h",hue(it.song));b.style.animationDelay=Math.min(n*40,600)+"ms";
    b.innerHTML="<b></b><small></small>"+(it.hot?"<em>🔥 hot</em>":"");
    b.firstChild.textContent="“"+it.line+"”";
    b.querySelector("small").textContent=LANG[it.lang]+" · "+it.song;
    b.onclick=()=>{idx=n;play(it)};
    $("#grid").appendChild(b);
  });
}
function jsonp(url){return new Promise((res,rej)=>{const cb="cb"+Date.now()+Math.floor(Math.random()*999),s=document.createElement("script");
  window[cb]=d=>{res(d);s.remove();delete window[cb]};s.onerror=rej;s.src=url+"&callback="+cb;document.head.appendChild(s)})}
async function lookup(q){
  if(cache[q])return cache[q];
  try{const r=await fetch("/api/search?term="+encodeURIComponent(q));if(r.ok)return cache[q]=await r.json()}catch(e){}
  // fallback: iTunes JSONP straight from the browser (works even if /api isn't deployed)
  const d=await jsonp("https://itunes.apple.com/search?media=music&entity=song&limit=5&country=IN&term="+encodeURIComponent(q));
  const t=(d.results||[]).find(x=>x.previewUrl);if(!t)throw 0;
  return cache[q]={previewUrl:t.previewUrl,title:t.trackName,artist:t.artistName,art:(t.artworkUrl100||"").replace("100x100","400x400")};
}
function fade(ms){return new Promise(res=>{const t0=performance.now(),v0=au.volume;
  (function s(n){const p=Math.min(1,(n-t0)/ms);au.volume=v0*(1-p);p<1?requestAnimationFrame(s):res()})(t0)})}
function speak(t,l){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=VOICE[l];u.rate=.95;speechSynthesis.speak(u)}catch(e){}}
function words(t){$("#bang").innerHTML="";t.split(" ").forEach((w,i)=>{const s=document.createElement("span");s.textContent=w;s.style.animationDelay=i*90+"ms";$("#bang").appendChild(s)})}

async function play(it){
  const my=++token;clearTimeout(timer);
  $("#stage").classList.add("show");
  $("#bang").innerHTML="";$("#vinyl").classList.remove("on");$("#beq").classList.add("off");
  $("#cd").classList.remove("go");
  $("#now").textContent="Loading banger…";
  au.pause();try{speechSynthesis.cancel()}catch(e){}au.volume=1;
  let s;
  try{s=await lookup(it.song)}catch(e){
    $("#now").textContent="Couldn’t find “"+it.song+"”, skipping…";
    if(auto)timer=setTimeout(()=>step(1),1800);return}
  if(my!==token)return;
  $("#art").src=s.art;$("#bgart").style.backgroundImage=`url(${s.art})`;
  $("#now").textContent="♪ "+s.title+" — "+s.artist;
  au.src=s.previewUrl;
  au.onloadedmetadata=()=>{au.currentTime=Math.min(it.start||0,Math.max(0,au.duration-8))};
  try{await au.play()}catch(e){$("#now").textContent="Tap Replay to allow audio.";return}
  const drop=Math.max(2000,it.drop||6000);
  $("#vinyl").classList.add("on");$("#beq").classList.remove("off");
  const cd=$("#cd");cd.style.setProperty("--d",drop+"ms");void cd.offsetWidth;cd.classList.add("go");
  preload();
  timer=setTimeout(async()=>{
    if(my!==token)return;
    await fade(450);if(my!==token)return;
    au.pause();au.volume=1;
    $("#vinyl").classList.remove("on");$("#beq").classList.add("off");
    words(it.line);speak(it.line,it.lang);boom();
    if(auto)timer=setTimeout(()=>{if(my===token)step(1)},4500+it.line.length*40);
  },drop-450);
}
function step(d){
  if(!queue.length)return;
  idx=shuf?Math.floor(Math.random()*queue.length):(idx+d+queue.length)%queue.length;
  play(queue[idx]);
}
function preload(){const n=queue[(idx+1)%queue.length];if(n)lookup(n.song).then(s=>{const a=new Audio();a.preload="auto";a.src=s.previewUrl}).catch(()=>{})}

// confetti + shake
const cv=$("#conf"),cx=cv.getContext("2d");let ps=[];
function boom(){
  cv.width=innerWidth;cv.height=innerHeight;
  $("#stage").classList.remove("shake");void $("#stage").offsetWidth;$("#stage").classList.add("shake");
  ps=Array.from({length:110},()=>({x:cv.width/2,y:cv.height*.55,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+3,c:`hsl(${Math.random()*360} 90% 60%)`,l:90}));
  (function f(){cx.clearRect(0,0,cv.width,cv.height);ps=ps.filter(p=>p.l-->0);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;cx.fillStyle=p.c;cx.globalAlpha=p.l/90;cx.fillRect(p.x,p.y,p.r,p.r)});
    if(ps.length)requestAnimationFrame(f)})();
}
function close(){token++;clearTimeout(timer);au.pause();try{speechSynthesis.cancel()}catch(e){}$("#stage").classList.remove("show")}

$("#x").onclick=close;
$("#next").onclick=()=>step(1);$("#prev").onclick=()=>step(-1);
$("#again").onclick=()=>queue[idx]&&play(queue[idx]);
$("#auto").onclick=e=>{auto=!auto;e.target.classList.toggle("on",auto)};
$("#shuf").onclick=e=>{shuf=!shuf;e.target.classList.toggle("on",shuf)};
$("#party").onclick=()=>{auto=true;$("#auto").classList.add("on");idx=0;if(queue.length)play(queue[0])};
$("#form").onsubmit=e=>{e.preventDefault();
  items.unshift({line:$("#fl").value.trim(),song:$("#fs").value.trim(),lang:$("#fg").value,start:3,drop:6000});
  e.target.reset();render()};
addEventListener("keydown",e=>{if(!$("#stage").classList.contains("show"))return;
  if(e.key==="Escape")close();if(e.key==="ArrowRight")step(1);if(e.key==="ArrowLeft")step(-1);if(e.key===" "){e.preventDefault();$("#again").click()}});
init();
</script>
</body>
</html>
