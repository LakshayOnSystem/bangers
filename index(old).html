<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banger Lines 🔊</title>
<style>
:root{--bg:#0e0e14;--card:#1a1a24;--ink:#f4f4f8;--mute:#9a9ab0;--acc:#ff4d6d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,sans-serif}
header{padding:28px 16px 8px;text-align:center}
h1{margin:0;font-size:2rem}
header p{color:var(--mute);margin:6px 0 0}
.tabs{display:flex;gap:8px;justify-content:center;padding:16px;flex-wrap:wrap}
.tabs button{background:var(--card);color:var(--ink);border:1px solid #333;border-radius:99px;padding:8px 18px;cursor:pointer;font:inherit}
.tabs button.on{background:var(--acc);border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding:8px 16px 24px;max-width:1100px;margin:auto}
.card{background:var(--card);border:1px solid #2a2a38;border-radius:14px;padding:16px;cursor:pointer;text-align:left;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--acc)}
.card b{font-size:1.05rem}
.card small{color:var(--mute)}
.add{max-width:700px;margin:0 auto 40px;padding:0 16px;display:flex;gap:8px;flex-wrap:wrap}
.add input,.add select,.add button{padding:10px;border-radius:10px;border:1px solid #333;background:var(--card);color:var(--ink);font:inherit}
.add input{flex:1 1 200px}
.add button{background:var(--acc);border:0;cursor:pointer}
#stage{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;padding:24px;text-align:center;z-index:5}
#stage.show{display:flex}
#art{width:min(60vw,260px);aspect-ratio:1;border-radius:16px;object-fit:cover;background:var(--card)}
#now{color:var(--mute)}
#bang{font-size:clamp(1.8rem,7vw,4rem);font-weight:800;opacity:0;transform:scale(.7);transition:.25s}
#bang.hit{opacity:1;transform:scale(1)}
#close{background:none;border:1px solid #555;color:var(--ink);border-radius:99px;padding:8px 20px;cursor:pointer;font:inherit}
</style>
</head>
<body>
<header><h1>🔊 Banger Lines</h1><p>Tap a card. The banger drops. Then the line lands.</p></header>
<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>
<form class="add" id="form">
  <input id="fl" placeholder="Your iconic line" required>
  <input id="fs" placeholder="Song (e.g. Tauba Tauba Karan Aujla)" required>
  <select id="fg"><option value="hi">Hindi</option><option value="en">English</option><option value="pa">Punjabi</option></select>
  <button>Add</button>
</form>
<div id="stage">
  <img id="art" alt="">
  <div id="now"></div>
  <div id="bang"></div>
  <button id="close">Close</button>
</div>
<audio id="au" preload="auto"></audio>
<script>
const $=s=>document.querySelector(s);
const LANG={all:"All",hi:"Hindi",en:"English",pa:"Punjabi"};
const VOICE={hi:"hi-IN",en:"en-US",pa:"pa-IN"};
let items=[],filter="all",token=0;
const au=$("#au"),cache={};

async function init(){
  try{items=await (await fetch("catalog.json")).json()}catch(e){items=[]}
  $("#tabs").innerHTML=Object.entries(LANG).map(([k,v])=>`<button data-k="${k}" class="${k==="all"?"on":""}">${v}</button>`).join("");
  $("#tabs").onclick=e=>{const k=e.target.dataset.k;if(!k)return;filter=k;
    document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.k===k));render()};
  render();
}
function render(){
  const list=items.filter(i=>filter==="all"||i.lang===filter);
  $("#grid").innerHTML="";
  list.forEach(it=>{
    const b=document.createElement("button");b.className="card";
    b.innerHTML=`<b></b><small></small>`;
    b.firstChild.textContent="“"+it.line+"”";
    b.lastChild.textContent=LANG[it.lang]+" · "+it.song;
    b.onclick=()=>play(it);
    $("#grid").appendChild(b);
  });
}
async function lookup(q){
  if(cache[q])return cache[q];
  const r=await fetch("/api/search?term="+encodeURIComponent(q));
  if(!r.ok)throw new Error("not found");
  return cache[q]=await r.json();
}
function fade(ms){return new Promise(res=>{
  const t0=performance.now(),v0=au.volume;
  (function s(n){const p=Math.min(1,(n-t0)/ms);au.volume=v0*(1-p);p<1?requestAnimationFrame(s):res()})(t0)})}
function speak(text,lang){
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=VOICE[lang];u.rate=.95;speechSynthesis.speak(u)}catch(e){}
}
async function play(it){
  const my=++token;
  $("#stage").classList.add("show");
  $("#bang").classList.remove("hit");$("#bang").textContent=it.line;
  $("#now").textContent="Loading banger…";$("#art").removeAttribute("src");
  au.pause();speechSynthesis&&speechSynthesis.cancel();
  // unlock audio on this tap for mobile browsers
  au.volume=1;
  let s;
  try{s=await lookup(it.song)}catch(e){$("#now").textContent="Couldn't find that song. Edit its search text.";return}
  if(my!==token)return;
  $("#art").src=s.art;$("#now").textContent="♪ "+s.title+" — "+s.artist;
  au.src=s.previewUrl;
  au.onloadedmetadata=()=>{au.currentTime=Math.min(it.start||0,Math.max(0,au.duration-8))};
  try{await au.play()}catch(e){$("#now").textContent="Tap the card again to allow audio.";return}
  setTimeout(async()=>{
    if(my!==token)return;
    await fade(500);
    if(my!==token)return;
    au.pause();au.volume=1;
    $("#bang").classList.add("hit");speak(it.line,it.lang);
  },Math.max(1500,(it.drop||6000)-500));
}
$("#close").onclick=()=>{token++;au.pause();speechSynthesis&&speechSynthesis.cancel();$("#stage").classList.remove("show")};
$("#form").onsubmit=e=>{e.preventDefault();
  items.unshift({line:$("#fl").value.trim(),song:$("#fs").value.trim(),lang:$("#fg").value,start:3,drop:6000});
  e.target.reset();render();
};
init();
</script>
</body>
</html>
